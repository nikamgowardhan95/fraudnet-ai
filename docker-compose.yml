services:
  backend:
    build: .
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    ports: ['8000:8000']
    environment:
      DATABASE_URL: sqlite:///./fraudnet.db
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ['.:/app']
    command: sh -c 'corepack enable && pnpm install && pnpm dev --hostname 0.0.0.0'
    ports: ['3000:3000']
